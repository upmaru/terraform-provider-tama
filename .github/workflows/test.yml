# Terraform Provider testing workflow.
name: Tests

# This GitHub action runs your tests for each pull request and push.
# Optionally, you can turn it on using a schedule for regular testing.
on:
  push:
    paths-ignore:
      - "README.md"

# Testing only needs permissions to read the repository contents.
permissions:
  contents: read

jobs:
  # Ensure project builds before running testing matrix
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
          cache: true
      - run: go mod download
      - run: go build -v .
      - name: Run linters
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.0

  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
          cache: true
      # We need the latest version of Terraform for our documentation generation to use
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - run: make generate
      - name: git diff
        run: |
          git diff --compact-summary --exit-code || \
            (echo; echo "Unexpected difference in directories after code generation. Run 'make generate' command and commit."; exit 1)

  # Run acceptance tests in a matrix with Terraform CLI versions
  test:
    name: Terraform Provider Acceptance Tests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      packages: read
    strategy:
      fail-fast: false
      matrix:
        # list whatever Terraform versions here you would like to support
        terraform:
          - "1.0.*"
          - "1.1.*"
          - "1.2.*"
          - "1.3.*"
          - "1.4.*"
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: tama_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      tama:
        image: ghcr.io/upmaru/tama:0.13-ci
        env:
          DATABASE_URL: postgres://postgres:postgres@postgres:5432/tama_test
          TAMA_MAX_VECTOR_DIMENSIONS: 1024
          TAMA_VAULT_KEY: MJOdb4sy3/xXzdYPDRZE3Jcj0gHx3utVsyCpCuTrRWM=
          TAMA_JWT_SECRET: MJOdb4sy3/xXzdYPDRZE3Jcj0gHx3utVsyCpCuTrRWM=
          TAMA_OAUTH_ISSUER: http://localhost:4000
          TAMA_OAUTH_SIGNING_KEY: development-only-oauth-signing-key-change-me
          TAMA_OAUTH_SIGNING_KEY_ID: oauth-ci-1
          SECRET_KEY_BASE: mmgb4Aoa2PphESQICdr31vVXHhvufcrXS7hDPK+mx8CWnNfWEDtthx6zD49L4Cqv
          PHX_HOST: localhost
          PHX_SERVER: true
        ports:
          - 4000:4000
        options: --link postgres:postgres
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
          cache: true
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ matrix.terraform }}
          terraform_wrapper: false
      - name: Bootstrap Tama
        env:
          TAMA_BASE_URL: "http://localhost:4000"
          TAMA_API_KEY: "dummy"
          TAMA_CLIENT_ID: "0199bde3-991f-749d-a7b6-f3f44d63dbdd"
          TAMA_CLIENT_SECRET: "c29tZS1zZWNyZXQ"
        run: |
          terraform -chdir=scripts/setup init -upgrade
          terraform -chdir=scripts/setup apply -auto-approve
      - run: go mod download
      - env:
          TF_ACC: "1"
          TAMA_BASE_URL: "http://localhost:4000"
          TAMA_API_KEY: "dummy"
          TAMA_CLIENT_ID: "0199bde3-991f-749d-a7b6-f3f44d63dbdd"
          TAMA_CLIENT_SECRET: "c29tZS1zZWNyZXQ"
        run: |
          go test -v -cover ./...
        timeout-minutes: 30
